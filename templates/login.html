<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <title>登入 - LIHKG 討論區</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
        <h2 class="text-xl font-bold text-center text-blue-400">會員登入</h2>
        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">使用者名稱</label>
                <input type="text" name="username" class="w-full p-2.5 text-sm rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">密碼</label>
                <input type="password" name="password" class="w-full p-2.5 text-sm rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-500 font-bold rounded-lg hover:bg-blue-600 transition-colors">登入</button>
        </form>
        <div class="text-center">
            <a href="{{ url_for('home') }}" class="text-xs text-gray-400 hover:underline">返回首頁</a>
        </div>
    </div>
</body>
</html>
